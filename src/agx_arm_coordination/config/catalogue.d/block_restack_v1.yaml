      planning_group: both_arms
      source: moveit_planned
      to_pose: Grip_Block_Lifted
      velocity_scaling: 0.20
      acceleration_scaling: 0.20
      description: "Safe lifted pose above the block stack; used for approach and post-lift."

  both_arms_to_grip_block_04:
