# Block-restack demo v1 catalogue fragment (activity: block_restack_v1).
#
# Merged into the shared catalogue by graph_loader (config/catalogue.d/*.yaml).
#
# All arm actions are `both_arms`, `source: moveit_planned` (collision-aware).
# No recorded replays: the demo is a pure anchor sequence.
#
# velocity_scaling 0.05 for grip and place approaches; 0.10 for all transfers
# and returns. Payload switching is not modelled here — add `payload_update:
# attach/detach` to the gripper actions in the activity if the arm gravity
# model must follow the load.

actions:

  # --- Arm anchor moves (Trajectory, MoveIt-planned) -------------------------

  both_arms_to_boxing_idle:
    actiontype_id: Trajectory
    robot_id: both_arms
    metadata:
      planning_group: both_arms
      source: moveit_planned
      to_pose: Boxing_Both_Idle_V01
      velocity_scaling: 0.20
      acceleration_scaling: 0.20
      description: "Demo start/end pose."

  both_arms_to_grip_block_lifted:
