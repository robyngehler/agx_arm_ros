# Tea-pour demo catalogue fragment (activity: tea_pour_left_v1).
#
# Merged into the shared catalogue by graph_loader (config/catalogue.d/*.yaml).
# It lives in its own file because its three recorded actions carry ~140 taught
# waypoints, which would drown catalogue.yaml.
#
# LEFT SIDE ONLY. The right arm and right hand stay parked where they are; they
# are still brought up (both sides stay active) but this activity never addresses
# them, so the scheduler's right_can_bus unit is never claimed.
#
# NAMING: the anchor poses (arm_config.yaml) and hand gestures
# (agx_arm_ctrl/config/omnihand_pro_gestures.yaml) were captured under "Can_*"
# names before the object was settled -- the object is a TEAPOT and "Can_*" is a
# capture-time misnomer. The public action_ids here say teapot; the Can_* names
# are kept verbatim wherever they name stored data, so nothing has to be
# re-measured. Do not rename the stored poses/gestures without re-capturing.
#
# Hand actions carry only skill_name (the skill -> motion/preset mapping lives in
# agx_arm_ctrl/config/omnihand_skills.yaml). Arm actions are either MoveIt-planned
# anchor moves (to_pose) or taught replays (source: recorded + waypoints).

actions:

  # --- Hand skills (Gripper, left hand) -------------------------------------
  # motion `pose` (not close_until_contact): these presets were taught on the
  # real teapot, so the shape IS the grasp. Deterministic and repeatable, but
  # blind -- it will close on empty air just as happily if the handle is not
  # where the anchor says it is. Tactile-gated grasping stays available via the
  # grasp_*_until_contact skills once a contact threshold is calibrated (the 0.35
  # placeholder in catalogue.yaml is far below the raw normal-force magnitudes
  # the Pro actually reports).
  left_hand_rest_fist:
    actiontype_id: Gripper
    robot_id: left_hand
    metadata:
      skill_name: hand_rest_fist
      timeout_sec: 5.0
      description: "Tucked travel/rest shape; also the hand's init state."
      fallback_policy: { on_cancel: stop_motion, on_timeout: report_failure }
  left_hand_pre_grip_handle:
    actiontype_id: Gripper
    robot_id: left_hand
    metadata:
      skill_name: pre_grip_handle
      timeout_sec: 5.0
      description: "Open enough for the arm to thread the hand around the handle."
      fallback_policy: { on_cancel: stop_motion, on_timeout: report_failure }
  left_hand_grip_handle:
    actiontype_id: Gripper
    robot_id: left_hand
    metadata:
      skill_name: grip_handle
      timeout_sec: 5.0
      description: "Taught closure on the teapot handle."
      fallback_policy: { on_cancel: stop_and_hold, on_timeout: report_failure }
  left_hand_release_handle:
    actiontype_id: Gripper
    robot_id: left_hand
    metadata:
      skill_name: release_handle
      timeout_sec: 5.0
      description: "Open back to the pre-grip shape so the arm can withdraw."
      fallback_policy: { on_cancel: stop_motion, on_timeout: report_failure }

  # --- Arm anchor moves (Trajectory, MoveIt-planned, collision-aware) --------

  left_arm_to_teapot_grip_idle:
    actiontype_id: Trajectory
    robot_id: left_arm
    metadata:
      planning_group: left_arm
      source: moveit_planned
      to_pose: Can_Grip_Idle_L
      velocity_scaling: 0.10
      acceleration_scaling: 0.10
      description: "Approach standoff in front of the teapot."

  left_arm_to_teapot_pre_grip:
    actiontype_id: Trajectory
    robot_id: left_arm
    metadata:
      planning_group: left_arm
      source: moveit_planned
      to_pose: Can_Pre_Grip_L
      velocity_scaling: 0.10
      acceleration_scaling: 0.10
      description: "Pre-grip pose; staging pose for the taught handle-entry replay."

  left_arm_to_teapot_grip:
    actiontype_id: Trajectory
    robot_id: left_arm
    metadata:
      planning_group: left_arm
      source: moveit_planned
      to_pose: Can_Grip_L
      velocity_scaling: 0.05
      acceleration_scaling: 0.05
      description: "Final seat in the handle. Sits ~0.22 rad (j5) / 0.20 rad (j7) past the end of the handle-entry replay -- that offset IS the twist that seats the hand in the handle, so it runs at 0.05 scaling, with the hand still in pre-grip shape around the handle."

  left_arm_to_teapot_post_grip:
    actiontype_id: Trajectory
    robot_id: left_arm
    metadata:
      planning_group: left_arm
      source: moveit_planned
      to_pose: Can_Post_Grip_L
      velocity_scaling: 0.10
      acceleration_scaling: 0.10
      description: "Lift the teapot clear of the table."

  left_arm_to_pour_init:
    actiontype_id: Trajectory
    robot_id: left_arm
    metadata:
      planning_group: left_arm
      source: moveit_planned
      to_pose: Can_Fill_Init_L
      velocity_scaling: 0.10
      acceleration_scaling: 0.10
      description: "Neutral carry pose between table and pour station (used twice in the graph)."

  left_arm_to_pour_idle:
    actiontype_id: Trajectory
    robot_id: left_arm
    metadata:
      planning_group: left_arm
      source: moveit_planned
      to_pose: Can_Fill_Idle
      velocity_scaling: 0.10
      acceleration_scaling: 0.10
      description: "Pour station standoff; staging pose for the pour replay."

  left_arm_to_teapot_pre_place:
    actiontype_id: Trajectory
    robot_id: left_arm
    metadata:
      planning_group: left_arm
      source: moveit_planned
      to_pose: Pre_Place_Can_L
      velocity_scaling: 0.10
      acceleration_scaling: 0.10
      description: "Standoff above the teapot's table position."

  left_arm_to_teapot_place:
    actiontype_id: Trajectory
    robot_id: left_arm
    metadata:
      planning_group: left_arm
      source: moveit_planned
      to_pose: Place_Can_L
      velocity_scaling: 0.10
      acceleration_scaling: 0.10
      description: "Teapot set down; staging pose for the handle-release replay."


  # --- Arm taught replays (Trajectory, source: recorded) --------------------
  # Each of these is dispatched as TWO MoveIt goals by the coordinator: a planned,
  # collision-aware MoveGroup approach to waypoint 0, then the ExecuteTrajectory
  # replay. The preceding anchor node is therefore a staging pose, not a required
  # start state -- the residual offset to the taught start is closed by that
  # planned approach, so nothing here has to be re-taught when an anchor moves.
  #
  # ExecuteTrajectory executes, it does not plan: the replay ITSELF is not
  # collision checked. It is only as safe as the taught motion was.
  #
  # For a recorded action velocity_scaling is a pure TIME STRETCH
  # (arm_executor._recorded_time_scale = 1/min(vel, acc)), not a planner limit.
  # 0.75 replays the taught motion 1.33x slower than taught. It is deliberately
  # NOT the 0.10 used above, which would stretch the 14.5 s pour to 145 s.

  left_arm_teapot_handle_entry:
    actiontype_id: Trajectory
    robot_id: left_arm
    metadata:
      planning_group: left_arm
      source: recorded
      velocity_scaling: 0.75
      acceleration_scaling: 0.75
      entry_pose: Can_Pre_Grip_L
      description: "Threads the hand into the teapot handle."
      # taught 3.42 s -> replayed 4.56 s at 0.75 time-stretch.
      # waypoint 0 sits 0.0139 rad from anchor Can_Pre_Grip_L; the coordinator's
