# Wave demo catalogue fragment (activity: wave_after_unpack_v1).
#
# Merged into the shared catalogue by graph_loader (config/catalogue.d/*.yaml).
# Anchors: config/arm_config.yaml. Recordings: config/recordings/.
#
# The activity enters and leaves on Functional_Init_Both_V03, which is where
# unit_unpack_top_v1 ends, so `both_arms_to_functional_init` is REUSED from the
# tea fragment instead of redefined here: action_ids are one flat namespace and a
# second definition is a load error, not an override.
#
# Both anchors are `both_arms` poses — the taught vectors are 14-DoF, so an
# anchor move always states where both arms are, including the arm that is not
# the subject of the step.
#
# The two replays reference a lean sidecar at full taught density instead of
# inlining decimated waypoints. Their joint names are side-prefixed, so
# arm_executor._assert_recorded_joints checks the side against the group rather
# than taking this file's word for it.
#
# Playback is `smooth` at a 0.5 s window on both replays, which reproduces the
# taught pace. A hand-guided wave can exceed a setpoint limit, and `smooth`
# reports that where `tempo_scale` refuses the replay. Change the pace with
# `playback: {mode: tempo_scale, speed_scale: <x>}` — it carries a speed request
# and is refused past the joint limits. `playback` is the single timing authority
# on a recorded action, so neither carries velocity_scaling / acceleration_scaling.

actions:

  # --- Anchor moves (Trajectory, MoveIt-planned, collision-aware) ------------
  both_arms_to_wave_both_init_v01:
    actiontype_id: Trajectory
    robot_id: both_arms
    metadata:
      planning_group: both_arms
      source: moveit_planned
      to_pose: Wave_Both_Init_V01
      velocity_scaling: 0.20
      acceleration_scaling: 0.10
      description: "Both arms raised into the start pose of the two-arm wave."

  both_arms_to_wave_right_init_v01:
    actiontype_id: Trajectory
    robot_id: both_arms
    metadata:
      planning_group: both_arms
      source: moveit_planned
      to_pose: Wave_Right_Init_V01
      velocity_scaling: 0.20
      acceleration_scaling: 0.10
      description: "Right arm into the start pose of the right-arm wave; the left arm drops to the pose it holds through it."

  # --- Dwell ----------------------------------------------------------------
  # A hold rather than a move: two identical waypoints two seconds apart at the
  # pose the preceding `both_arms_to_functional_init` arrives on. Under four
  # waypoints the retiming dispatches the points as taught, and a two-point
  # stationary path gets zero velocities — which is what a hold commands.
  #
  # The positions repeat Functional_Init_Both_V03 from arm_config.yaml;
  # test_wave_after_unpack_v1 asserts the two still agree.
  both_arms_hold_functional_init_5s:
    actiontype_id: Trajectory
    robot_id: both_arms
    metadata:
      planning_group: both_arms
      source: recorded
      waypoints:
        - positions: [0.66113, 0.27574, -0.37867, 1.95095, 0.21187, 0.25398, 0.38174, 1.16820, 0.38341, -0.60612, 1.75530, 0.18658, 0.19005, 0.49080]
          time_from_start_sec: 0.0
        - positions: [0.66113, 0.27574, -0.37867, 1.95095, 0.21187, 0.25398, 0.38174, 1.16820, 0.38341, -0.60612, 1.75530, 0.18658, 0.19005, 0.49080]
          time_from_start_sec: 2.0
      description: "Two-second hold at the working pose, so the two waves read as two gestures instead of one motion."

  # --- Taught replays -------------------------------------------------------
  both_arms_wave_both_v01:
    actiontype_id: Trajectory
    robot_id: both_arms
    metadata:
      planning_group: both_arms
      source: recorded
      # 2236 pts, 30.16 s, taught 2026-08-24 as a duo merge of the two arms.
      # Starts within 0.002 rad of Wave_Both_Init_V01.
      recording: recordings/Wave_Both_V01.json
      playback: { mode: tempo_scale, smoothing_window_sec: 0.5, speed_scale: 1.5 }
      description: "Both arms wave."

  right_arm_wave_right_v01:
    actiontype_id: Trajectory
    robot_id: right_arm
    metadata:
      planning_group: right_arm
      source: recorded
      # 1192 pts, 19.76 s, taught 2026-08-24 on the right arm. Starts within
      # 0.021 rad of the right half of Wave_Right_Init_V01.
      recording: recordings/Wave_Right_V01.json
      playback: { mode: tempo_scale, smoothing_window_sec: 0.5, speed_scale: 1.0 }
      description: "Right arm waves alone; the left arm holds its anchor pose."
