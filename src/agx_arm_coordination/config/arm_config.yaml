# Arm executor config for the coordinator. The coordinator drives arm motion
# through the MoveIt multi-arm slice (brought up by components
# `mode:=moveit_mit`): there is NO per-group controller here. Anchor->anchor
# transitions go to move_group (collision-aware plan + execute); recorded
# trajectories replay through execute_trajectory. MoveIt fans a both_arms plan out
# to the per-arm /<side>_arm/arm_controller servers natively.
#
# Each group's MoveIt planning group and joint names come from the motion registry
# (duo_motion_registry.yaml) — single source of truth, not listed here. both_arms
# is left joints then right joints, so the to_pose [..._L, ..._R] order matches.
# Every anchor pose below is all-zeros today; measure the real joint vectors on
# hardware (hefeweizen_validation_log.md). Until then run with arm_dry_run:=true.

arm_executor:
  # MoveIt action servers (override if move_group runs under a namespace).
  move_group_action: /move_action
  execute_trajectory_action: /execute_trajectory

  # Arm groups the coordinator drives (geometry comes from the registry).
  groups:
    - both_arms
    - left_arm
    - right_arm

  defaults:
    # Legacy timing knobs, retained for compatibility; MoveIt times anchor moves.
    base_move_time_sec: 4.0
    min_move_time_sec: 1.5

  # Named anchor poses. Preferred form stores the resource explicitly:
  #   my_pose: {robot_id: right_arm, q: [7 values]}        # single side (7-DoF)
  #   both_pose: {robot_id: both_arms, q: [14 values]}     # left then right (14-DoF)
  # Legacy bare lists still load; their side is inferred from an _L/_R suffix
  # (e.g. Can_Pre_Grip_L/_R below pair into a both_arms target). An un-suffixed
  # bare list has no resolvable side — re-capture it or add robot_id.
  poses:
    Functional_Init_Both_V02: {robot_id: both_arms, q: [-0.25292, 0.52496, -0.65724, 1.64480, 0.21822, -0.11069, 0.08933, -1.08149, 0.39305, 1.02468, 1.92051, -0.34355, 0.18530, 0.24682]}
