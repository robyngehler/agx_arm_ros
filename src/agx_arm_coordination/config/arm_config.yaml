    Place_Block_02: {robot_id: both_arms, q: [-0.49993, 0.87286, -0.79339, 1.50510, 0.37490, 0.32639, 1.22128, 1.67056, 1.18963, 0.40907, 1.86204, 0.20396, 0.45686, 0.29981]}
