/**:
  ros__parameters:
    joint_names: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
    control_rate_hz: 200.0
    feedback_timeout_s: 0.25
    auto_enable_on_trajectory: true
    hold_final_point: true
    gain_ramp_time_s: 1.0
    position_error_limit: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
    # Manufacturer maximum joint speeds: J1-J3 180 deg/s, J4-J7 225 deg/s.
    # A clamp below them silently limits what the planner and the time-optimal
    # parameterization are allowed to ask for, and the tracking error that
    # follows trips the per-joint hold.
    velocity_limit: [3.1416, 3.1416, 3.1416, 3.927, 3.927, 3.927, 3.927]
    torque_limit: [8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0]
    # Hold gains. Bumped stiffer with clearly more damping for the first hardware
    # runs: kp ~+50% (holds the target tighter) and kd ~2.5x (viscous damping to
    # kill oscillation/overshoot) vs the original [2,3,2,3,2,2,2]/[0.1..0.08]. If a
    # joint buzzes/vibrates, lower its kd first (noise on velocity feedback); if it
    # is sluggish/soft, raise kp. Both are live-tunable via `ros2 param set`.
    kp: [50.0, 20.0, 50.0, 20.0, 20.0, 10.0, 10.0]
    kd: [1.5, 1.5, 2.0, 1.5, 1.5, 1.5, 1.5]
    # Software freedrive (teach idle/record): kp is forced to 0 so gravity
    # feedforward makes the arm back-drivable; freedrive_kd only damps motion.
    # Deliberately started high (~5x the hold kd) so the first hardware runs are
    # stable/viscous rather than lively. Tune down once it proves stable: lower
    # if it feels sticky, raise if the arm drifts/oscillates.
    freedrive_kd: [0.2, 0.4, 0.2, 0.3, 0.15, 0.15, 0.2]
    gravity_compensation_enabled: true
    gravity_backend: pinocchio
    # Leave empty to auto-discover the canonical Nero URDF.
    gravity_urdf_path: ""
    gravity_scale: 1.0
    gravity_feedforward_sign: -1.0
    # Arm base orientation in world as [roll, pitch, yaw] (XYZ extrinsic, rad).
    # [0,0,0] = upright table mount. Set to the body mounting pose so freedrive
    # gravity compensation is correct for a tilted arm.
    gravity_mounting_rpy: [0.0, 0.0, 0.0]
    # Carried-payload model (payload_mass_kg, payload_com_xyz, payload_cylinder_*,
    # payload_parent_link) is NOT set here: the launch file always passes it, and
    # its explicit parameters override this file. Set it with the launch argument.
    # Leave empty to auto-discover config/nero_gravity_calibration.json.
    calibration_file: ""
    action_name: arm_controller/follow_joint_trajectory
    action_feedback_rate_hz: 20.0
    start_state_tolerance: [0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10]
    goal_position_tolerance: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05]
    goal_velocity_tolerance: [0.20, 0.20, 0.20, 0.20, 0.20, 0.20, 0.20]
    goal_time_tolerance_s: 0.5
    allow_joint_reordering: false
    reject_new_goal_while_executing: true
    enable_debug_joint_trajectory_topic: false
