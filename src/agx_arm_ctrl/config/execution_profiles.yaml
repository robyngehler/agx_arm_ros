profiles:
  manual: {}

  standalone:
    robot_name: agx_arm
    moveit_profile: nero_arm
    effector_type: none

  left_arm:
    robot_name: duo_nero_system
    use_duo_model: true
    moveit_profile: left_arm
    effector_type: none
    custom_model_xacro_args:
      use_left_arm: true
      use_left_hand: false
      use_right_arm: false
      use_right_hand: false

  left_hand:
    robot_name: duo_nero_system
    use_duo_model: true
    moveit_profile: left_arm
    effector_type: omnihand
    omnihand_type: left
    launch_omnihand_bridge: true
    custom_model_xacro_args:
      use_left_arm: true
      use_left_hand: true
      use_right_arm: false
      use_right_hand: false

  right_arm:
    robot_name: duo_nero_system
    use_duo_model: true
    moveit_profile: right_arm
    effector_type: none
    custom_model_xacro_args:
      use_left_arm: false
      use_left_hand: false
      use_right_arm: true
      use_right_hand: false

  right_hand:
    robot_name: duo_nero_system
    use_duo_model: true
    moveit_profile: right_arm
    effector_type: omnihand
    omnihand_type: right
    launch_omnihand_bridge: true
    custom_model_xacro_args:
      use_left_arm: false
      use_left_hand: false
      use_right_arm: true
      use_right_hand: true

  # Duo MoveIt slice. `mode:=moveit_mit` brings up one per-arm MIT controller per
  # side (namespaced /<side>_arm/arm_controller) plus move_group; MoveIt owns the
  # both_arms execution (it fans a both_arms plan out to the per-arm controllers
  # natively). The coordinator dispatches arm motions through MoveGroup /
  # ExecuteTrajectory on this same slice — there is no separate both_arms controller.
  duo_arm:
    robot_name: duo_nero_system
    use_duo_model: true
    moveit_profile: both_arms
    effector_type: none
    custom_model_xacro_args:
      use_left_arm: true
      use_left_hand: false
      use_right_arm: true
      use_right_hand: false
    arm_instances:
      - name: left_arm
        namespace: left_arm
        joint_prefix: left_arm_
        feedback_joint_prefix: left_arm_
        launch_driver: false
      - name: right_arm
        namespace: right_arm
        joint_prefix: right_arm_
        feedback_joint_prefix: right_arm_
        launch_driver: false